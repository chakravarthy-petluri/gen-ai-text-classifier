apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-text-classifier
  namespace: default
  labels:
    app: genai-text-classifier
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: genai-text-classifier
  template:
    metadata:
      labels:
        app: genai-text-classifier
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: genai-text-classifier
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: genai-text-classifier
        # Multi-cloud compatible image reference
        # Replace REGISTRY with your cloud's container registry:
        # - Oracle Cloud: iad.ocir.io/YOUR_NAMESPACE
        # - AWS: YOUR_ACCOUNT.dkr.ecr.REGION.amazonaws.com
        # - GCP: gcr.io/YOUR_PROJECT
        # - Azure: YOUR_REGISTRY.azurecr.io
        image: REGISTRY/genai-text-classifier:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: genai-text-classifier-config
              key: spring.profiles.active
        - name: SPRING_APPLICATION_NAME
          valueFrom:
            configMapKeyRef:
              name: genai-text-classifier-config
              key: spring.application.name
        # API keys and sensitive data from Secrets
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genai-text-classifier-secrets
              key: gemini-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: genai-text-classifier-secrets
              key: openai-api-key
              optional: true
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65532
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - genai-text-classifier
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: genai-text-classifier
  namespace: default
  labels:
    app: genai-text-classifier
spec:
  type: ClusterIP
  selector:
    app: genai-text-classifier
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genai-text-classifier
  namespace: default
  labels:
    app: genai-text-classifier
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genai-text-classifier
  namespace: default
spec:
  rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genai-text-classifier
  namespace: default
spec:
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: genai-text-classifier
  subjects:
  - kind: ServiceAccount
    name: genai-text-classifier
    namespace: default