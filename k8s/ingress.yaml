---
# Standard Kubernetes Ingress (works with any ingress controller)
# Deploy an ingress controller based on your cloud:
# - Oracle Cloud OKE: nginx-ingress-controller (default available)
# - AWS EKS: AWS ALB Ingress Controller or nginx
# - GCP GKE: GCP Cloud Load Balancing or nginx
# - Azure AKS: Azure Application Gateway or nginx

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genai-text-classifier
  namespace: default
  labels:
    app: genai-text-classifier
  annotations:
    # Ingress class - adjust based on your cloud provider
    kubernetes.io/ingress.class: "nginx"

    # TLS/SSL annotations
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting (nginx specific, adjust for your controller)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"

    # CORS support
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
spec:
  ingressClassName: nginx
  rules:
  - host: genai-classifier.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: genai-text-classifier
            port:
              number: 80
  tls:
  - hosts:
    - genai-classifier.example.com
    secretName: genai-classifier-tls
---
# ClusterIP Service (internal communication)
# Already defined in deployment.yaml, but can be referenced separately
apiVersion: v1
kind: Service
metadata:
  name: genai-text-classifier
  namespace: default
  labels:
    app: genai-text-classifier
spec:
  type: ClusterIP
  selector:
    app: genai-text-classifier
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
# LoadBalancer Service (if you prefer load balancer over Ingress)
# Uncomment to use LoadBalancer instead of Ingress
