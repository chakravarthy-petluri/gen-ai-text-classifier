# Helm values for Oracle Cloud Kubernetes Engine (OKE)
# Usage: helm install genai-classifier helm/genai-classifier/ -f helm/values-oracle.yaml

image:
  registry: iad.ocir.io/YOUR_TENANCY/YOUR_REPOSITORY
  repository: genai-text-classifier
  tag: v1.0.0
  pullPolicy: IfNotPresent

replicaCount: 3

app:
  name: genai-text-classifier
  port: 8080
  springProfilesActive: prod

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx  # OKE uses nginx-ingress by default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/enable-cors: "true"
  hosts:
    - host: genai-classifier.oracle.example.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    enabled: true
    secretName: genai-classifier-tls

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
  # Example: Specific node pool
  # oci.oraclecloud.com/node-pool: "default"

tolerations: []

secrets:
  create: false  # Set to true and provide values in helm install --set
  geminiApiKey: ""
  openaiApiKey: ""

configMap:
  create: true
  data:
    spring.profiles.active: "prod"
    spring.application.name: "genai-text-classifier"
