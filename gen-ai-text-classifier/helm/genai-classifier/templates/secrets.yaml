{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "genai-text-classifier.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genai-text-classifier.labels" . | nindent 4 }}
type: Opaque
stringData:
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
{{- end }}