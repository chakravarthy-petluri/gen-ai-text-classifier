{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "genai-text-classifier.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "genai-text-classifier.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}